<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>reimagine — gallery</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --edge: #262b36;
    --fg: #e6e8ec; --muted: #8b93a1; --accent: #6ea8fe;
  }
  * { box-sizing: border-box; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body.lightbox-open { position: fixed; width: 100%; overflow: hidden; }
  header {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 12px 20px; background: rgba(15,17,21,.9);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--edge);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header .stat { color: var(--muted); font-size: 12px; }
  header .grow { flex: 1; }
  select, button {
    background: var(--panel); color: var(--fg); border: 1px solid var(--edge);
    border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer;
  }
  label.toggle { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  main { padding: 20px; }
  #gallery {
    position: relative; width: 100%; margin: 0; padding: 0;
    list-style: none;
  }
  .virtual-heading {
    position: absolute; left: 0; right: 0; list-style: none;
  }
  .virtual-heading h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 0 0 12px; font-weight: 600;
  }
  .virtual-item {
    position: absolute; list-style: none;
  }
  .card {
    background: var(--panel); border: 1px solid var(--edge); border-radius: 12px;
    width: 100%; padding: 0; overflow: hidden; color: inherit; font: inherit;
    text-align: left; cursor: pointer;
    transition: border-color .15s, transform .05s;
  }
  .card:hover { border-color: var(--accent); }
  .card:focus-visible, button:focus-visible, select:focus-visible,
  input:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }
  .card:active { transform: scale(.996); }
  .card .imgwrap { position: relative; background: #000; aspect-ratio: 1 / 1; }
  .card .imgwrap.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; }
  .card img, .card video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .cap { padding: 8px 10px; font-size: 12px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { position: absolute; top: 6px; left: 6px; font-size: 10px;
    background: rgba(0,0,0,.6); color: #fff; padding: 2px 6px; border-radius: 6px;
    letter-spacing: .04em; }
  .badge.vid { left: auto; right: 6px; background: rgba(110,168,254,.85); }
  .empty { color: var(--muted); padding: 40px; text-align: center; }

  /* lightbox */
  #lb {
    position: fixed; inset: 0; z-index: 20; display: none;
    background: rgba(7,8,11,.94); padding: 24px;
    flex-direction: column; gap: 14px; overscroll-behavior: contain;
  }
  #lb.open { display: flex; }
  #lb .bar { display: flex; align-items: center; gap: 16px; color: var(--muted); }
  #lb .bar .name { color: var(--fg); font-weight: 600; }
  #lb .bar .grow { flex: 1; }
  #lb .stage {
    flex: 1; min-height: 0; display: grid; gap: 14px;
    grid-template-columns: 1fr; align-items: center; justify-items: center;
    overflow: auto; overscroll-behavior: contain;
    touch-action: pan-x pan-y pinch-zoom;
  }
  #lb .stage.side { grid-template-columns: 1fr 1fr; }
  #lb figure { margin: 0; height: 100%; width: 100%;
    display: flex; flex-direction: column; min-height: 0; }
  #lb figcaption { color: var(--muted); font-size: 12px; text-align: center;
    padding-bottom: 6px; }
  #lb img, #lb video { max-width: 100%; max-height: 100%; object-fit: contain;
    margin: auto; border-radius: 8px; }
  #lb .prompt {
    flex: 0 0 auto; max-height: none; overflow: hidden;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 10px;
    padding: 10px 14px; color: var(--fg); font-size: 13px; line-height: 1.55;
  }
  #lb .prompt .lbl {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; min-height: 28px; margin: 0; padding: 0;
    background: none; border: 0; color: var(--accent); font: inherit;
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    font-weight: 600; text-align: left; cursor: pointer;
  }
  #lb .prompt .lbl::after {
    content: "▸"; color: var(--muted); font-size: 12px;
    letter-spacing: 0; text-transform: none;
  }
  #lb .prompt .prompt-body { display: none; }
  #lb .prompt.expanded { max-height: 22vh; overflow-y: auto; }
  #lb .prompt.expanded .lbl { margin-bottom: 6px; }
  #lb .prompt.expanded .lbl::after { content: "▾"; }
  #lb .prompt.expanded .prompt-body { display: block; }
  #lb .prompt.empty .prompt-body { color: var(--muted); font-style: italic; }
  #lb .hint { color: var(--muted); font-size: 12px; text-align: center; }
  @media (orientation: portrait) {
    #lb .prompt { max-height: none; overflow: hidden; padding: 8px 14px; }
    #lb .prompt.expanded { max-height: 28vh; overflow-y: auto; }
  }
  @media (pointer: coarse) {
    #lb { padding: 16px; }
    #lb .hint { font-size: 0; }
    #lb .hint::after { content: "Swipe or tap edges to move · pinch to zoom"; font-size: 12px; }
  }
</style>
</head>
<body>
<header>
  <h1>reimagine</h1>
  <label class="toggle" for="sourceSel">source</label>
  <select id="sourceSel" title="which output set to browse"></select>
  <span class="stat" id="stat">loading…</span>
  <span class="grow"></span>
  <label class="toggle"><input type="checkbox" id="videoMode"> video</label>
  <label class="toggle"><input type="checkbox" id="compareAll"> compare in grid</label>
  <label class="sr-only" for="catFilter">Filter by category</label>
  <select id="catFilter"><option value="">all categories</option></select>
  <button id="refresh">refresh</button>
</header>

<main id="main"><div class="empty" role="status">loading…</div></main>

<div id="lb" role="dialog" aria-modal="true" aria-labelledby="lbName">
  <div class="bar">
    <span class="name" id="lbName"></span>
    <span id="lbMeta"></span>
    <span class="grow"></span>
    <label class="toggle"><input type="checkbox" id="lbSide" checked> side-by-side</label>
    <button id="lbClose">close ✕</button>
  </div>
  <div class="stage side" id="lbStage"></div>
  <div class="prompt" id="lbPrompt" aria-live="polite"></div>
  <div class="hint">← / → or click edges to move · S to toggle side-by-side · Esc to close</div>
</div>

<script>
const STREAM_RENDER_BATCH = 100;
const MIN_CARD_WIDTH = 220;
const GRID_GAP = 14;
const CARD_CAP_HEIGHT = 35;
const CATEGORY_HEADER_HEIGHT = 38;
const OVERSCAN_ROWS = 3;

let ITEMS = [];
let VIEW = [];        // filtered list currently shown (for lightbox nav)
let LAYOUT = [];
let cur = -1;
let pageScrollY = 0;
let returnFocus = null;
let loadController = null;
let loadVersion = 0;
let loading = false;
let loadError = "";
let renderDeferred = false;
let preferredCategory = "";
let renderedWindowKey = "";
let layoutWidth = 0;
let layoutColumns = 1;
let layoutRowHeight = 0;
let virtualFrame = 0;
const METADATA_CACHE = new Map();

const $ = (id) => document.getElementById(id);
const escapeHtml = (s) => s.replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const setBackgroundInert = (inert) => {
  document.querySelector("header").inert = inert;
  $("main").inert = inert;
};

const SOURCE_KEY = "reimagine.source";  // persists the pick across full reloads

async function loadSources(signal) {
  const r = await fetch("/api/sources", { cache: "no-store", signal });
  const data = await r.json();
  const sources = data.sources || [];
  const sel = $("sourceSel");
  // Prefer the live pick, else the one saved from a prior page load, else the
  // server default — so a full browser reload (F5) keeps the same source.
  let saved = null;
  try { saved = localStorage.getItem(SOURCE_KEY); } catch (e) {}
  const want = sel.value || saved || data.default;
  sel.innerHTML = sources.map(s =>
    `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join("");
  if (sources.includes(want)) sel.value = want;
  else if (data.default) sel.value = data.default;
  sel.disabled = sources.length <= 1;
}

async function load() {
  const version = ++loadVersion;
  loadController?.abort();
  loadController = new AbortController();
  METADATA_CACHE.clear();
  loading = true;
  loadError = "";
  ITEMS = [];
  preferredCategory = $("catFilter").value;
  $("catFilter").innerHTML = '<option value="">all categories</option>';
  renderedWindowKey = "";
  render();
  try {
    await loadSources(loadController.signal);
    if (version !== loadVersion) return;
    const source = $("sourceSel").value;
    const url = source
      ? `/api/stream?source=${encodeURIComponent(source)}`
      : "/api/stream";
    const response = await fetch(url, {
      cache: "no-store", signal: loadController.signal,
    });
    if (!response.ok || !response.body) {
      throw new Error(`gallery request failed (${response.status})`);
    }
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let sinceRender = 0;
    while (true) {
      const { value, done } = await reader.read();
      buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) {
        if (!line) continue;
        ITEMS.push(JSON.parse(line));
        sinceRender++;
        if (sinceRender === STREAM_RENDER_BATCH) {
          updateCategoryFilter();
          render();
          sinceRender = 0;
          await new Promise(requestAnimationFrame);
          if (version !== loadVersion) return;
        }
      }
      if (done) break;
    }
    if (buffer.trim()) ITEMS.push(JSON.parse(buffer));
  } catch (error) {
    if (error.name === "AbortError") return;
    loadError = error.message;
  } finally {
    if (version !== loadVersion) return;
    loading = false;
    updateCategoryFilter();
    render();
  }
}

function updateCategoryFilter() {
  const cats = [...new Set(ITEMS.map(i => i.category))].sort();
  const sel = $("catFilter");
  const want = sel.value || preferredCategory;
  sel.innerHTML = '<option value="">all categories</option>' +
    cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
  if (cats.includes(want)) {
    sel.value = want;
    preferredCategory = "";
  } else if (!loading) {
    preferredCategory = "";
  }
}

function galleryTop() {
  const gallery = $("gallery");
  return gallery ? gallery.getBoundingClientRect().top + window.scrollY : 0;
}

function buildLayout() {
  const gallery = $("gallery");
  if (!gallery) return;
  const width = gallery.clientWidth;
  layoutWidth = width;
  layoutColumns = Math.max(
    1, Math.floor((width + GRID_GAP) / (MIN_CARD_WIDTH + GRID_GAP)));
  const cardWidth =
    (width - GRID_GAP * (layoutColumns - 1)) / layoutColumns;
  layoutRowHeight = cardWidth + CARD_CAP_HEIGHT + GRID_GAP;
  const groups = new Map();
  VIEW.forEach((item, idx) => {
    if (!groups.has(item.category)) groups.set(item.category, []);
    groups.get(item.category).push({ item, idx });
  });
  LAYOUT = [];
  let top = 0;
  for (const category of [...groups.keys()].sort()) {
    LAYOUT.push({
      type: "heading", category, top, height: CATEGORY_HEADER_HEIGHT,
    });
    top += CATEGORY_HEADER_HEIGHT;
    const entries = groups.get(category);
    for (let start = 0; start < entries.length; start += layoutColumns) {
      LAYOUT.push({
        type: "row", category, top, height: layoutRowHeight,
        entries: entries.slice(start, start + layoutColumns),
        cardWidth,
      });
      top += layoutRowHeight;
    }
  }
  gallery.style.height = `${Math.max(0, top - GRID_GAP)}px`;
}

function visibleLayout() {
  const top = window.scrollY - galleryTop();
  const overscan = layoutRowHeight * OVERSCAN_ROWS;
  const start = top - overscan;
  const end = top + window.innerHeight + overscan;
  return LAYOUT.filter(unit =>
    unit.top + unit.height >= start && unit.top <= end);
}

function findLayoutRow(index) {
  return LAYOUT.find(unit =>
    unit.type === "row"
    && unit.entries.some(entry => entry.idx === index));
}

function renderWindow(force = false) {
  const gallery = $("gallery");
  if (!gallery || !LAYOUT.length) return;
  const units = visibleLayout();
  const compareAll = $("compareAll").checked;
  const videoMode = $("videoMode").checked;
  const key = [
    compareAll, videoMode, layoutColumns,
    ...units.map(unit => [
      unit.type, unit.category, unit.top,
      ...(unit.entries || []).map(entry => entry.item.path),
    ].join(":")),
  ].join("|");
  if (!force && key === renderedWindowKey) return;
  const activeIndex = document.activeElement?.closest?.(".card")?.dataset.idx;
  gallery.innerHTML = units.map(unit => {
    if (unit.type === "heading") {
      return `<li class="virtual-heading" role="presentation"
                  style="top:${unit.top}px;height:${unit.height}px">
        <h2>${escapeHtml(unit.category)}</h2>
      </li>`;
    }
    return unit.entries.map(({ item, idx }, column) => `
      <li class="virtual-item"
          aria-setsize="${VIEW.length}" aria-posinset="${idx + 1}"
          style="top:${unit.top}px;left:${column * (unit.cardWidth + GRID_GAP)}px;width:${unit.cardWidth}px">
        ${card(item, idx, compareAll, videoMode)}
      </li>`).join("");
  }).join("");
  renderedWindowKey = key;
  if (activeIndex !== undefined) {
    const replacement = gallery.querySelector(
      `.card[data-idx="${activeIndex}"]`);
    const fallback = replacement || gallery.querySelector(".card");
    fallback?.focus({ preventScroll: true });
  }
}

function scheduleWindowRender() {
  if (virtualFrame) return;
  virtualFrame = requestAnimationFrame(() => {
    virtualFrame = 0;
    const gallery = $("gallery");
    if (gallery && gallery.clientWidth !== layoutWidth) {
      const localTop = window.scrollY - galleryTop();
      const anchor = LAYOUT.find(unit =>
        unit.type === "row"
        && unit.top + unit.height >= localTop);
      const anchorIndex = anchor?.entries[0]?.idx;
      const offset = anchor ? Math.max(0, localTop - anchor.top) : 0;
      buildLayout();
      const replacement = findLayoutRow(anchorIndex);
      if (replacement) {
        window.scrollTo(
          0, galleryTop() + replacement.top
          + Math.min(offset, replacement.height - 1));
      }
      renderedWindowKey = "";
    }
    renderWindow();
  });
}

function focusLogicalCard(index) {
  index = Math.max(0, Math.min(VIEW.length - 1, index));
  const unit = findLayoutRow(index);
  if (!unit) return;
  const top = galleryTop() + unit.top;
  const bottom = top + unit.height - GRID_GAP;
  const headerBottom = document.querySelector("header").offsetHeight;
  if (top < window.scrollY + headerBottom) {
    window.scrollTo(0, top - headerBottom);
  } else if (bottom > window.scrollY + window.innerHeight) {
    window.scrollTo(0, bottom - window.innerHeight);
  }
  renderWindow(true);
  requestAnimationFrame(() => {
    $("gallery")?.querySelector(
      `.card[data-idx="${index}"]`)?.focus({ preventScroll: true });
  });
}

function render() {
  const cat = $("catFilter").value || preferredCategory;
  VIEW = ITEMS.filter(i => !cat || i.category === cat);
  const src = $("sourceSel").value;
  $("stat").textContent =
    (src ? `${src} · ` : "") +
    `${ITEMS.length} render${ITEMS.length === 1 ? "" : "s"}` +
    (loading ? " loaded…" : "") +
    (cat ? ` · ${VIEW.length} in ${cat}` : "");

  if ($("lb").classList.contains("open")) {
    renderDeferred = true;
    return;
  }
  const main = $("main");
  if (!VIEW.length) {
    renderedWindowKey = "";
    const message = loadError
      ? `Could not load gallery: ${escapeHtml(loadError)}`
      : loading
        ? "Loading images…"
        : "No renders yet. They appear here as the batch completes — hit refresh.";
    main.innerHTML = `<div class="empty" role="status">${message}</div>`;
    return;
  }
  const created = !$("gallery");
  if (created) {
    main.innerHTML = `
      <p id="galleryHelp" class="sr-only">
        Use arrow keys to move through all gallery items.
      </p>
      <ul id="gallery" aria-label="Gallery renders"
          aria-describedby="galleryHelp" tabindex="-1"></ul>`;
  }
  buildLayout();
  renderWindow(created);
}

function card(it, idx, compareAll, videoMode) {
  const useVideo = videoMode && it.video_url;
  // The "output" cell shows the video when in video mode and one exists,
  // otherwise the static render.
  const outCell = useVideo
    ? `<video src="${it.video_url}" muted loop playsinline preload="metadata"
              aria-label="Video preview for ${escapeHtml(it.path)}"
              onmouseenter="this.play()" onmouseleave="this.pause()"></video>`
    : `<img loading="lazy" src="${it.output_thumbnail_url || it.output_url}"
            onerror="this.onerror=null;this.src='${escapeHtml(it.output_url)}'"
            alt="Reimagined ${escapeHtml(it.path)}">`;
  const showBoth = compareAll && it.input_url;
  const imgs = showBoth
    ? `<img loading="lazy" src="${it.input_thumbnail_url || it.input_url}"
            onerror="this.onerror=null;this.src='${escapeHtml(it.input_url)}'"
            alt="Reference ${escapeHtml(it.path)}">${outCell}`
    : outCell;
  const badges =
    (it.input_url ? "" : '<span class="badge">no ref</span>') +
    (it.video_url ? '<span class="badge vid">▶ video</span>' : "");
  return `<button class="card" type="button" data-idx="${idx}"
                  aria-label="View ${escapeHtml(it.path)}">
      <div class="imgwrap${showBoth ? " compare" : ""}">${imgs}${badges}</div>
      <div class="cap">${escapeHtml(it.path)}</div>
    </button>`;
}

function updatePromptNodes(label, text) {
  const prompt = $("lbPrompt");
  let button = prompt.querySelector(".lbl");
  let body = prompt.querySelector("#lbPromptBody");
  if (!button || !body) {
    prompt.innerHTML =
      `<button type="button" class="lbl" aria-controls="lbPromptBody"></button>
       <div class="prompt-body" id="lbPromptBody"></div>`;
    button = prompt.querySelector(".lbl");
    body = prompt.querySelector("#lbPromptBody");
  }
  button.textContent = label;
  button.setAttribute(
    "aria-expanded",
    prompt.classList.contains("expanded") ? "true" : "false");
  body.textContent = text;
}

function renderPrompt(useVideo, metadata) {
  const prompt = $("lbPrompt");
  const text = useVideo
    ? (metadata.video_prompt || metadata.prompt)
    : metadata.prompt;
  const label = useVideo && metadata.video_prompt ? "video prompt" : "prompt";
  prompt.classList.toggle("empty", !text);
  prompt.removeAttribute("aria-busy");
  updatePromptNodes(
    label, text || "no saved prompt for this render");
}

async function loadPrompt(item, useVideo) {
  const source = $("sourceSel").value;
  const key = `${source}\n${item.path}`;
  if (!METADATA_CACHE.has(key)) {
    const url = `/api/metadata?source=${encodeURIComponent(source)}&path=${encodeURIComponent(item.path)}`;
    const request = fetch(url, { cache: "no-store" })
      .then(response => {
        if (!response.ok) {
          throw new Error(`metadata request failed (${response.status})`);
        }
        return response.json();
      })
      .catch(error => {
        if (METADATA_CACHE.get(key) === request) {
          METADATA_CACHE.delete(key);
        }
        throw error;
      });
    METADATA_CACHE.set(key, request);
  }
  let metadata = {};
  try {
    metadata = await METADATA_CACHE.get(key);
  } catch (error) {}
  if (cur >= 0 && VIEW[cur] === item && $("sourceSel").value === source) {
    renderPrompt(useVideo, metadata);
  }
}

function openLb(idx) {
  cur = idx;
  const it = VIEW[cur];
  const opening = !$("lb").classList.contains("open");
  $("lbName").textContent = it.path;
  const useVideo = $("videoMode").checked && it.video_url;
  // The reimagined cell is a looping video in video mode (when one exists),
  // else the static render.
  const outMedia = useVideo
    ? `<video src="${it.video_url}" autoplay muted loop playsinline controls
              aria-label="Reimagined video ${escapeHtml(it.path)}"></video>`
    : `<img src="${it.output_url}" alt="Reimagined ${escapeHtml(it.path)}">`;
  const outLabel = useVideo ? "reimagined (video)" : "reimagined";
  const side = $("lbSide").checked && !!it.input_url;
  const stage = $("lbStage");
  stage.classList.toggle("side", side);
  stage.innerHTML = side
    ? `<figure><figcaption>reference</figcaption><img src="${it.input_url}" alt="Reference ${escapeHtml(it.path)}"></figure>
       <figure><figcaption>${outLabel}</figcaption>${outMedia}</figure>`
    : `<figure><figcaption>${outLabel}${it.input_url ? "" : " (no reference)"}</figcaption>${outMedia}</figure>`;
  $("lbMeta").textContent = it.input_url ? "" : "no matching reference";
  const prompt = $("lbPrompt");
  if (opening) {
    prompt.classList.toggle(
      "expanded",
      !window.matchMedia("(orientation: portrait)").matches);
  }
  prompt.classList.remove("empty");
  prompt.setAttribute("aria-busy", "true");
  updatePromptNodes("prompt", "Loading prompt…");
  loadPrompt(it, useVideo);
  if (opening) {
    pageScrollY = window.scrollY;
    returnFocus = document.activeElement;
    document.body.style.top = `-${pageScrollY}px`;
    document.body.classList.add("lightbox-open");
    setBackgroundInert(true);
    $("lb").classList.add("open");
    $("lbClose").focus();
  }
}

function closeLb() {
  if (!$("lb").classList.contains("open")) return;
  const returnIndex = returnFocus?.dataset.idx;
  $("lb").classList.remove("open");
  $("lbPrompt").classList.remove("expanded");
  setBackgroundInert(false);
  document.body.classList.remove("lightbox-open");
  document.body.style.top = "";
  window.scrollTo(0, pageScrollY);
  cur = -1;
  if (renderDeferred) {
    renderDeferred = false;
    render();
  }
  renderWindow(true);
  const replacement = returnIndex === undefined ? null :
    $("main").querySelector(`.card[data-idx="${returnIndex}"]`);
  if (replacement) {
    replacement.focus();
  } else if (returnFocus?.isConnected) {
    returnFocus.focus();
  } else {
    $("gallery")?.focus({ preventScroll: true });
  }
  returnFocus = null;
}
function step(d) {
  if (cur < 0 || !VIEW.length) return;
  openLb((cur + d + VIEW.length) % VIEW.length);
}

$("refresh").addEventListener("click", load);
$("sourceSel").addEventListener("change", () => {
  try { localStorage.setItem(SOURCE_KEY, $("sourceSel").value); } catch (e) {}
  closeLb(); load();
});
$("catFilter").addEventListener("change", () => {
  preferredCategory = $("catFilter").value;
  window.scrollTo(0, $("main").getBoundingClientRect().top + window.scrollY);
  render();
});
$("compareAll").addEventListener("change", render);
$("videoMode").addEventListener("change", () => { render(); if (cur >= 0) openLb(cur); });
$("main").addEventListener("click", (event) => {
  const card = event.target.closest(".card");
  if (card) openLb(+card.dataset.idx);
});
$("main").addEventListener("keydown", (event) => {
  const card = event.target.closest(".card");
  if (!card) return;
  const index = +card.dataset.idx;
  const movements = {
    ArrowLeft: -1,
    ArrowRight: 1,
    ArrowUp: -layoutColumns,
    ArrowDown: layoutColumns,
    Home: -index,
    End: VIEW.length - 1 - index,
  };
  if (!(event.key in movements)) return;
  event.preventDefault();
  focusLogicalCard(index + movements[event.key]);
});
window.addEventListener("scroll", scheduleWindowRender, { passive: true });
window.addEventListener("resize", scheduleWindowRender);
$("lbClose").addEventListener("click", closeLb);
$("lbSide").addEventListener("change", () => cur >= 0 && openLb(cur));
$("lb").addEventListener("click", (e) => { if (e.target.id === "lb") closeLb(); });
$("lbPrompt").addEventListener("click", (e) => {
  if (!e.target.closest(".lbl")) return;
  const pr = $("lbPrompt");
  const open = !pr.classList.contains("expanded");
  pr.classList.toggle("expanded", open);
  e.target.closest(".lbl").setAttribute("aria-expanded", open ? "true" : "false");
});

const EDGE_RATIO = 0.2;
const TAP_SLOP = 14;
const isNavChrome = (el) => el.closest(
  ".bar, .prompt, .hint, button, input, label, video, a, select"
);
const visualPoint = (clientX, clientY) => {
  const vv = window.visualViewport;
  return vv
    ? { x: clientX - vv.offsetLeft, y: clientY - vv.offsetTop, w: vv.width, h: vv.height }
    : { x: clientX, y: clientY, w: window.innerWidth, h: window.innerHeight };
};
let edgeTap = null;
$("lb").addEventListener("pointerdown", (e) => {
  if (!e.isPrimary || e.button) { edgeTap = null; return; }
  if (isNavChrome(e.target)) { edgeTap = null; return; }
  edgeTap = { id: e.pointerId, x: e.clientX, y: e.clientY };
});
$("lb").addEventListener("pointermove", (e) => {
  if (!edgeTap || e.pointerId !== edgeTap.id) return;
  if (Math.hypot(e.clientX - edgeTap.x, e.clientY - edgeTap.y) > TAP_SLOP) {
    edgeTap = null;
  }
});
$("lb").addEventListener("pointerup", (e) => {
  if (!edgeTap || e.pointerId !== edgeTap.id) return;
  const start = edgeTap;
  edgeTap = null;
  if (Math.hypot(e.clientX - start.x, e.clientY - start.y) > TAP_SLOP) return;
  const { x, w } = visualPoint(e.clientX, e.clientY);
  const band = w * EDGE_RATIO;
  if (x <= band) step(-1);
  else if (x >= w - band) step(1);
});
$("lb").addEventListener("pointercancel", () => { edgeTap = null; });

let swipeStart = null;
$("lbStage").addEventListener("touchstart", (e) => {
  if (e.touches.length !== 1 || !e.target.closest("img")) {
    swipeStart = null;
    return;
  }
  const touch = e.touches[0];
  swipeStart = {
    x: touch.clientX,
    y: touch.clientY,
    scale: window.visualViewport?.scale || 1,
  };
}, { passive: true });
$("lbStage").addEventListener("touchend", (e) => {
  if (!swipeStart || e.changedTouches.length !== 1) return;
  const touch = e.changedTouches[0];
  const dx = touch.clientX - swipeStart.x;
  const dy = touch.clientY - swipeStart.y;
  const scale = window.visualViewport?.scale || 1;
  if (swipeStart.scale <= 1.05 && scale <= 1.05
      && Math.abs(dx) >= 60 && Math.abs(dx) > Math.abs(dy) * 1.25) {
    step(dx < 0 ? 1 : -1);
  }
  swipeStart = null;
}, { passive: true });
$("lbStage").addEventListener("touchcancel", () => { swipeStart = null; });
document.addEventListener("keydown", (e) => {
  if (!$("lb").classList.contains("open")) return;
  if (e.key === "Tab") {
    const focusable = [...$("lb").querySelectorAll(
      'button:not([disabled]), input:not([disabled]), video[controls], [tabindex]:not([tabindex="-1"])'
    )];
    const first = focusable[0], last = focusable[focusable.length - 1];
    if (e.shiftKey && (document.activeElement === first
                       || !$("lb").contains(document.activeElement))) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  } else if (e.key === "Escape") closeLb();
  else if (e.key === "ArrowRight") step(1);
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "s" || e.key === "S") { $("lbSide").checked = !$("lbSide").checked; openLb(cur); }
});

load();
</script>
</body>
</html>
